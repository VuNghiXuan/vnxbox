<!-- Đoạn mã xử lý hiển thị kết quả Tập đoàn AI trực tiếp trong khung chat (JavaScript snippet) -->
<script>
    // Hàm xử lý khi nhận phản hồi từ API chat_query
    function handleChatResponse(data) {
        let chatBox = document.getElementById('chat-messages-container');

        // 1. Hiển thị tin nhắn thông thường hoặc thông báo kích hoạt
        let messageDiv = document.createElement('div');
        messageDiv.className = "p-3 my-2 rounded-lg bg-gray-800 text-gray-100";

        if (data.type === "corporate_action") {
            // Nếu là lệnh tác vụ tự trị (Corporate Action)
            let tasksHtml = data.tasks.map(t => `
                <div class="text-xs bg-gray-900 p-2 my-1 rounded border border-gray-700 flex justify-between">
                    <span>[${t.task_id}] ${t.title}</span>
                    <span class="text-green-400 font-bold">${t.status}</span>
                </div>
            `).join('');

            messageDiv.innerHTML = `
                <p class="font-bold text-green-400 mb-2">⚡ ${data.message}</p>
                <div class="mb-2">
                    <p class="text-xs font-semibold text-blue-400">📋 Các tác vụ DAG đã thực thi:</p>
                    ${tasksHtml}
                </div>
                <div class="mt-3">
                    <p class="text-xs font-semibold text-purple-400">🧪 Báo cáo Kiểm thử QA:</p>
                    <pre class="bg-gray-900 p-2 rounded text-xs font-mono overflow-x-auto text-gray-300">${data.test_report}</pre>
                </div>
            `;
        } else {
            // Nếu là chat thông thường (CHAT_FAST)
            messageDiv.innerHTML = `<p>${data.message}</p>`;
        }

        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
