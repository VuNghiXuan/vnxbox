<!-- File path: templates/dashboard/partials/upload_modal.html -->
<!-- Chú thích: Modal Nạp file tài liệu hoặc nhập văn bản thô vào hệ thống vnxBox Enterprise -->

<div x-show="showUploadModal" style="display: none;"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 space-y-6 shadow-2xl relative font-mono"
        @click.away="showUploadModal = false">

        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h3 class="font-bold text-sm text-emerald-400 uppercase tracking-wide">📂 Nạp tài liệu tri thức mới</h3>
            <button @click="showUploadModal = false"
                class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
        </div>

        <div class="space-y-4 text-xs">
            <!-- Nhập lĩnh vực -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-slate-400 mb-1">Lĩnh vực (Domain)</label>
                    <input type="text" x-model="newDomain" placeholder="VD: Thu đổi vàng"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Nghiệp vụ chi tiết (Sub-Domain)</label>
                    <input type="text" x-model="newSubDomain" placeholder="VD: Vàng 9999"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- Tải lên tệp tin -->
            <div>
                <label class="block text-slate-400 mb-1">Tải lên tệp tin (PDF, Excel, Word, TXT, MD)</label>
                <input type="file" @change="handleFileSelect($event)"
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-slate-300 file:mr-4 file:py-1.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500">
            </div>

            <div class="text-center text-slate-500 text-[11px]">- HOẶC -</div>

            <!-- Nhập văn bản thô -->
            <div>
                <label class="block text-slate-400 mb-1">Dán nội dung văn bản thô (Raw Text)</label>
                <textarea x-model="newRawText" rows="5"
                    placeholder="Nhập trực tiếp quy chế, điều khoản nội bộ vào đây..."
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500 leading-relaxed"></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-3 pt-2 border-t border-slate-800">
            <button @click="showUploadModal = false"
                class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition">
                Hủy bỏ
            </button>
            <button @click="submitIngest()" :disabled="ingesting"
                class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 text-white rounded-xl font-bold text-xs shadow transition flex items-center gap-2">
                <span x-show="ingesting">⏳ Đang xử lý & Băm Vector...</span>
                <span x-show="!ingesting">🚀 Xác nhận Nạp & Phân Tích</span>
            </button>
        </div>
    </div>
</div>
