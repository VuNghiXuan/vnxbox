<!-- File path: dashboard/partials/chat_widget.html -->
<!-- Chú thích: Floating Chat Widget nổi góc phải màn hình, hỗ trợ tra cứu nhanh khi ở giao diện quản trị cho vnxBox Enterprise. -->

<div x-data="chatWidget()" class="fixed bottom-6 right-6 z-50">
    <!-- Nút bong bóng chat nổi -->
    <template x-if="!isOpen">
        <button @click="isOpen = true"
            class="relative group bg-gradient-to-br from-emerald-500 to-teal-700 hover:from-emerald-400 hover:to-teal-600 text-white p-4 rounded-full shadow-2xl shadow-emerald-900/50 flex items-center justify-center transition-all duration-300 transform hover:scale-110 active:scale-95">
            <!-- Vòng hào quang lan tỏa nhẹ -->
            <span
                class="absolute inset-0 rounded-full bg-emerald-400 opacity-30 animate-ping group-hover:opacity-50"></span>
            <svg class="w-6 h-6 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
        </button>
    </template>

    <!-- Hộp thoại chat -->
    <template x-if="isOpen">
        <div
            class="w-[380px] h-[520px] bg-slate-950/95 backdrop-blur-md border border-slate-800/80 rounded-2xl shadow-2xl shadow-black/80 flex flex-col overflow-hidden transition-all duration-300 animate-in fade-in slide-in-from-bottom-5">

            <!-- Header khung chat -->
            <div class="bg-slate-900/90 px-4 py-3 border-b border-slate-800 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2.5">
                    <span class="relative flex h-2.5 w-2.5">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <div>
                        <h3 class="font-bold text-xs text-white tracking-wide uppercase">vnxBox Local AI</h3>
                        <p class="text-[10px] text-emerald-400 font-medium">100% Offline & Secure Sandbox</p>
                    </div>
                </div>
                <button @click="isOpen = false"
                    class="text-slate-400 hover:text-white text-lg font-bold transition w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-800">&times;</button>
            </div>

            <!-- Khung danh sách tin nhắn -->
            <div class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
                <template x-for="msg in messages">
                    <div class="flex w-full" :class="msg.sender === 'user' ? 'justify-end' : 'justify-start'">

                        <!-- Bong bóng chat -->
                        <div :class="msg.sender === 'user' 
                                ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-2xl rounded-tr-sm shadow-md' 
                                : 'bg-slate-900 text-slate-200 border border-slate-800/80 rounded-2xl rounded-tl-sm shadow-md'"
                            class="px-3.5 py-2.5 max-w-[85%] w-fit text-left">

                            <!-- Nội dung text -->
                            <div class="text-left leading-normal text-xs break-words m-0 p-0" x-text="msg.text"></div>

                            <!-- Hiển thị Thẻ Trích dẫn Nguồn (Citations) nếu có -->
                            <template x-if="msg.citations && msg.citations.length > 0">
                                <div class="mt-2.5 pt-2 border-t border-slate-800/80 w-full text-left">
                                    <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider mb-1">📍
                                        Trích dẫn tài liệu:</p>
                                    <div class="flex flex-col gap-1.5">
                                        <template x-for="cite in msg.citations">
                                            <div @click="jumpToEdit(cite.chapter_id)"
                                                class="bg-slate-950 hover:bg-slate-900 px-2.5 py-1.5 rounded-lg border border-slate-800 text-[11px] text-slate-300 flex items-center justify-between gap-2 transition cursor-pointer group">
                                                <div class="flex items-center gap-1.5 truncate text-left">
                                                    <svg class="w-3 h-3 text-emerald-400 shrink-0" fill="none"
                                                        stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            stroke-width="2"
                                                            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                                    </svg>
                                                    <span
                                                        class="truncate font-medium group-hover:text-emerald-300 transition text-left"
                                                        x-text="cite.domain_name + ' > ' + cite.title"></span>
                                                </div>
                                                <span
                                                    class="text-[10px] text-emerald-400 font-mono shrink-0 bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-900">Sửa
                                                    ngay ↗</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

                    </div>
                </template>

                <!-- Trạng thái Loading đang tra cứu -->
                <template x-if="loading">
                    <div class="flex justify-start w-full">
                        <div
                            class="inline-flex items-center gap-2 bg-slate-900 border border-slate-800 text-slate-400 px-3 py-2 rounded-xl text-xs">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-bounce"></span>
                            <span
                                class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-bounce [animation-delay:0.2s]"></span>
                            <span
                                class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-bounce [animation-delay:0.4s]"></span>
                            <span class="text-[11px] text-slate-300 ml-1">AI đang định tuyến & tính toán...</span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Footer khung nhập tin nhắn -->
            <div class="p-3 bg-slate-900/90 border-t border-slate-800 flex gap-2 items-center shrink-0">
                <input type="text" x-model="question" @keydown.enter="sendMessage"
                    placeholder="Hỏi quy định, tra cứu dữ liệu..."
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                <button @click="sendMessage"
                    class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-4 py-2.5 rounded-xl text-xs font-semibold shadow transition flex items-center justify-center shrink-0">
                    <svg class="w-4 h-4 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </div>
    </template>
</div>
