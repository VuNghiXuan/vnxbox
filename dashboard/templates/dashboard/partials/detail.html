<!-- DETAIL VIEW (Bên phải - Hiển thị chi tiết & Định vị sâu Chương/Điều) -->
<div class="flex-1 flex flex-col bg-slate-900 overflow-y-auto p-6 relative">
    <template x-if="selectedChapter">
        <div class="max-w-4xl mx-auto w-full space-y-6">
            <!-- Tiêu đề, Badge Trạng thái & Các nút thao tác -->
            <div class="flex justify-between items-start border-b border-slate-800 pb-4">
                <div>
                    <div class="flex items-center gap-2 flex-wrap mb-1">
                        <span class="text-xs text-emerald-400 font-semibold uppercase tracking-wider"
                            x-text="selectedChapter.domain_name"></span>
                        <template x-if="selectedChapter.sub_domain">
                            <span class="text-xs text-slate-400 font-medium"
                                x-text="'> ' + selectedChapter.sub_domain"></span>
                        </template>
                        <span class="px-2 py-0.5 text-[10px] font-bold rounded uppercase" :class="{
                            'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30': selectedChapter.status === 'AUTO_APPROVED' || selectedChapter.status === 'APPROVED',
                            'bg-amber-500/20 text-amber-400 border border-amber-500/30 animate-pulse': selectedChapter.status === 'NEEDS_REVIEW',
                            'bg-slate-700 text-slate-300': selectedChapter.status === 'PENDING'
                        }" x-text="selectedChapter.status"></span>
                    </div>

                    <!-- Tiêu đề chính -->
                    <h2 class="text-2xl font-bold text-white mt-1" x-text="selectedChapter.title"></h2>

                    <!-- Vị trí định vị sâu (Chương / Điều) & Thời gian -->
                    <div class="flex items-center gap-4 mt-2 text-xs">
                        <template x-if="selectedChapter.chapter_code || selectedChapter.article_code">
                            <span
                                class="text-emerald-400 font-mono font-medium bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">
                                📍 <span
                                    x-text="(selectedChapter.chapter_code || '') + (selectedChapter.article_code ? ' > ' + selectedChapter.article_code : '')"></span>
                            </span>
                        </template>
                        <span class="text-slate-500">Cập nhật: <span
                                x-text="new Date(selectedChapter.updated_at).toLocaleString()"></span></span>
                    </div>
                </div>

                <div class="flex flex-wrap gap-2 items-center">
                    <!-- Nút gọi Modal AI Biên soạn lại -->
                    <button @click="showRecompileModal = true"
                        class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded shadow transition flex items-center gap-1">
                        <span>🤖 AI Biên soạn lại</span>
                    </button>
                    <button @click="updateStatus('APPROVED')"
                        class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded shadow transition">Duyệt</button>
                    <button @click="updateStatus('NEEDS_REVIEW')"
                        class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded shadow transition">Cần
                        xem lại</button>
                </div>
            </div>

            <!-- Banner cảnh báo nếu tài liệu bị NEEDS_REVIEW hoặc có lý do review -->
            <template x-if="selectedChapter.metadata && selectedChapter.metadata.review_reason">
                <div class="bg-amber-950/40 border border-amber-500/40 p-4 rounded-xl flex items-start gap-3">
                    <svg class="w-5 h-5 text-amber-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <div>
                        <h4 class="text-xs font-bold text-amber-400 uppercase">Cảnh báo từ AI (Mâu thuẫn hoặc Mơ hồ)
                        </h4>
                        <p class="text-sm text-amber-200 mt-1" x-text="selectedChapter.metadata.review_reason"></p>
                    </div>
                </div>
            </template>

            <!-- Tóm tắt -->
            <div class="bg-slate-800/50 border border-slate-800 p-4 rounded-xl">
                <h4 class="text-xs font-bold text-slate-400 uppercase mb-1">Tóm tắt ngắn gọn</h4>
                <p class="text-sm text-slate-300" x-text="selectedChapter.summary"></p>
            </div>

            <!-- Nội dung chi tiết (Content) -->
            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-400 uppercase">Nội dung chi tiết (Chunk chuẩn hóa)</h4>
                <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl text-sm text-slate-200 whitespace-pre-wrap leading-relaxed font-mono"
                    x-text="selectedChapter.content"></div>
            </div>

            <!-- Lịch sử nội dung trước khi biên soạn (Nếu có) -->
            <template x-if="selectedChapter.previous_content">
                <div class="space-y-2">
                    <h4 class="text-xs font-bold text-amber-500 uppercase">Lịch sử nội dung gốc (Trước khi AI biên soạn
                        lại)</h4>
                    <div class="bg-slate-950/70 border border-slate-800/80 p-4 rounded-xl text-xs text-slate-400 whitespace-pre-wrap leading-relaxed font-mono max-h-60 overflow-y-auto"
                        x-text="selectedChapter.previous_content"></div>
                </div>
            </template>

            <!-- Metadata & Công thức động -->
            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-400 uppercase">Metadata & Công thức trích xuất</h4>
                <div
                    class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-xs font-mono text-emerald-300 overflow-x-auto">
                    <pre x-text="JSON.stringify(selectedChapter.metadata, null, 2)"></pre>
                </div>
            </div>
        </div>
    </template>

    <!-- Trạng thái chưa chọn item nào -->
    <template x-if="!selectedChapter">
        <div class="flex-1 flex flex-col items-center justify-center text-slate-500">
            <svg class="w-16 h-16 mb-4 stroke-current opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            <p class="text-base font-medium">Chọn một chương tri thức ở danh sách bên trái để xem chi tiết</p>
        </div>
    </template>

    <!-- MODAL: AI BIÊN SOẠN LẠI -->
    <div x-show="showRecompileModal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm" style="display: none;">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-lg p-6 rounded-2xl shadow-2xl space-y-4"
            @click.away="showRecompileModal = false">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <span>🤖</span> Yêu cầu AI Biên soạn lại Tri thức
                </h3>
                <button @click="showRecompileModal = false" class="text-slate-400 hover:text-white">&times;</button>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Nhập hướng dẫn / yêu cầu cho
                    AI:</label>
                <textarea x-model="recompileInstruction" rows="4"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
                    placeholder="Ví dụ: Gộp bảng giá thành dạng Markdown rõ ràng hơn, sửa lại văn phong pháp lý..."></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button @click="showRecompileModal = false"
                    class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-xl transition">Hủy</button>
                <button @click="recompileWithAI()" :disabled="recompiling"
                    class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition flex items-center gap-2 disabled:opacity-50">
                    <span x-show="recompiling" class="animate-spin">⏳</span>
                    <span x-text="recompiling ? 'Đang biên soạn...' : 'Thực hiện Biên soạn'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
