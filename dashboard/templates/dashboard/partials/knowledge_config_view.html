<!-- File path: templates/dashboard/partials/knowledge_config_view.html -->
<!-- Chú thích: Giao diện Quản trị Kho Tri Thức Master-Detail & Cập nhật Lĩnh vực linh hoạt -->

<div x-show="currentView === 'config'" class="flex-1 flex overflow-hidden bg-slate-950 min-h-0 font-mono"
    x-data="{ searchTerm: '' }">

    <!-- ================= CỘT TRÁI: DANH SÁCH CHAPTERS & BỘ LỌC ================= -->
    <div class="w-1/3 border-r border-slate-800 flex flex-col bg-slate-950 min-h-0">
        <div class="p-4 border-b border-slate-800 flex flex-col gap-3 shrink-0">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-xs text-emerald-400 uppercase">Kho Tri Thức & Tài Liệu</h2>
                    <span
                        class="text-[10px] px-2 py-0.5 bg-slate-900 border border-slate-800 rounded-full text-slate-400"
                        x-text="filteredChapters.length + ' mục'"></span>
                </div>
                <button @click="showUploadModal = true"
                    class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow transition flex items-center gap-1">
                    <span>+ Nạp file mới</span>
                </button>
            </div>

            <!-- Ô TÌM KIẾM NHANH -->
            <div class="relative">
                <span
                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">🔍</span>
                <input type="text" x-model="searchTerm" placeholder="Tìm tiêu đề, nội dung tài liệu..."
                    class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Bộ lọc trạng thái & Lĩnh vực -->
            <div class="flex flex-col gap-2 text-xs">
                <div class="flex gap-1.5">
                    <button @click="filterStatus = ''"
                        :class="filterStatus === '' ? 'bg-emerald-600 text-white font-bold' : 'bg-slate-900 text-slate-400 border border-slate-800'"
                        class="px-2.5 py-1 rounded-lg transition">Tất cả</button>
                    <button @click="filterStatus = 'AUTO_APPROVED'"
                        :class="filterStatus === 'AUTO_APPROVED' ? 'bg-emerald-600 text-white font-bold' : 'bg-slate-900 text-slate-400 border border-slate-800'"
                        class="px-2.5 py-1 rounded-lg transition">Tự động duyệt</button>
                    <button @click="filterStatus = 'NEEDS_REVIEW'"
                        :class="filterStatus === 'NEEDS_REVIEW' ? 'bg-amber-600 text-white font-bold' : 'bg-slate-900 text-slate-400 border border-slate-800'"
                        class="px-2.5 py-1 rounded-lg transition">Cần kiểm tra</button>
                </div>
                <select x-model="filterDomain"
                    class="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-emerald-500">
                    <option value="">📂 Tất cả Lĩnh vực (Domains)</option>
                    <template x-for="d in availableDomains">
                        <option :value="d.domain_name" x-text="d.domain_name"></option>
                    </template>
                </select>
            </div>
        </div>

        <!-- Danh sách items -->
        <div class="flex-1 overflow-y-auto divide-y divide-slate-800/40 min-h-0">
            <template
                x-for="item in filteredChapters.filter(c => !searchTerm || c.title.toLowerCase().includes(searchTerm.toLowerCase()) || (c.source_file && c.source_file.toLowerCase().includes(searchTerm.toLowerCase())) || c.content.toLowerCase().includes(searchTerm.toLowerCase()))"
                :key="item.id">
                <div @click="selectedChapter = item"
                    :class="selectedChapter && selectedChapter.id === item.id ? 'bg-slate-900 border-l-4 border-emerald-500 shadow' : 'hover:bg-slate-900/40'"
                    class="p-4 cursor-pointer transition flex flex-col gap-1.5">
                    <div class="flex justify-between items-start">
                        <span
                            class="text-[10px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800"
                            x-text="item.domain_name"></span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase"
                            :class="item.status === 'AUTO_APPROVED' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'"
                            x-text="item.status"></span>
                    </div>
                    <h3 class="font-semibold text-xs text-slate-100 line-clamp-2" x-text="item.title"></h3>
                    <div class="flex justify-between items-center text-[10px] text-slate-400">
                        <span x-text="item.source_file || 'Văn bản thô'"></span>
                        <span x-text="item.chapter_code || ''"></span>
                    </div>
                </div>
            </template>
            <template x-if="filteredChapters.length === 0">
                <div class="p-6 text-center text-slate-500 text-xs">Không tìm thấy tài liệu nào.</div>
            </template>
        </div>
    </div>


    <!-- ================= CỘT PHẢI: CHI TIẾT & CHỈNH SỬA TÀI LIỆU ================= -->
    <div class="flex-1 flex flex-col bg-slate-900 overflow-y-auto p-6 min-h-0">
        <template x-if="!selectedChapter">
            <div class="flex-1 flex flex-col items-center justify-center text-slate-500 gap-2">
                <span class="text-4xl">📂</span>
                <p class="text-xs">Chọn một phân đoạn tri thức ở danh sách bên trái để xem và chỉnh sửa thông tin.</p>
            </div>
        </template>

        <template x-if="selectedChapter">
            <div class="max-w-4xl mx-auto w-full space-y-6">

                <!-- Tiêu đề & Nút thao tác -->
                <div class="flex justify-between items-start border-b border-slate-800 pb-4">
                    <div class="space-y-2 flex-1 mr-4">
                        <div class="flex items-center gap-3">
                            <!-- Chỉnh sửa Lĩnh vực (Domain) trực tiếp -->
                            <div class="flex flex-col gap-1">
                                <label class="text-[10px] text-slate-400 uppercase">Lĩnh vực (Domain)</label>
                                <input type="text" x-model="selectedChapter.domain_name"
                                    class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1 text-xs text-emerald-400 font-bold focus:outline-none focus:border-emerald-500">
                            </div>
                            <!-- Chỉnh sửa Nghiệp vụ (Sub-Domain) trực tiếp -->
                            <div class="flex flex-col gap-1">
                                <label class="text-[10px] text-slate-400 uppercase">Nghiệp vụ (Sub-Domain)</label>
                                <input type="text" x-model="selectedChapter.sub_domain" placeholder="Chưa phân loại"
                                    class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1 text-xs text-teal-400 focus:outline-none focus:border-teal-500">
                            </div>
                        </div>

                        <!-- Tiêu đề chính -->
                        <div class="pt-2">
                            <label class="text-[10px] text-slate-400 uppercase">Tiêu đề điều khoản / chương</label>
                            <input type="text" x-model="selectedChapter.title"
                                class="text-base font-bold text-white bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 w-full focus:outline-none focus:border-emerald-500 mt-1">
                        </div>
                    </div>

                    <div class="flex gap-2 shrink-0 pt-6">
                        <button @click="showRecompileModal = true"
                            class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow transition flex items-center gap-1.5">
                            <span>🤖 AI Biên Soạn Lại</span>
                        </button>
                        <button @click="alert('✅ Đã lưu và cập nhật tri thức thành công!')"
                            class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow transition">
                            💾 Lưu Thay Đổi
                        </button>
                    </div>
                </div>

                <!-- Thông tin nguồn định vị -->
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3 text-xs shadow">
                    <h4 class="font-bold text-emerald-400 uppercase tracking-wider">📁 Nguồn gốc & Định vị Cấu trúc</h4>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Nguồn File gốc</label>
                            <input type="text" x-model="selectedChapter.source_file" disabled
                                class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-400">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Mã Chương</label>
                            <input type="text" x-model="selectedChapter.chapter_code"
                                class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1">Mã Điều / Khoản</label>
                            <input type="text" x-model="selectedChapter.article_code"
                                class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                </div>

                <!-- Tóm tắt ngắn gọn -->
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-400 uppercase">Tóm tắt ngắn gọn</label>
                    <textarea x-model="selectedChapter.summary" rows="2"
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 focus:outline-none focus:border-emerald-500 leading-relaxed"></textarea>
                </div>

                <!-- FAQ Variations -->
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-2 text-xs shadow">
                    <h4 class="font-bold text-teal-400 uppercase tracking-wider">❓ Câu hỏi mẫu định tuyến ý định (Intent
                        Routing FAQs)</h4>
                    <div class="space-y-1.5">
                        <template x-for="faq in selectedChapter.faq_variations || []">
                            <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-200"
                                x-text="'- ' + faq.question_variation"></div>
                        </template>
                        <template x-if="!selectedChapter.faq_variations || selectedChapter.faq_variations.length === 0">
                            <p class="text-slate-500 italic">Chưa có câu hỏi FAQ nào.</p>
                        </template>
                    </div>
                </div>

                <!-- Nội dung Markdown kèm Nút Copy Bảng -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-slate-400 uppercase">Nội dung chi tiết & Bảng biểu
                            (Markdown)</label>
                        <button
                            @click="navigator.clipboard.writeText(selectedChapter.content); alert('📋 Đã copy toàn bộ nội dung bảng/Markdown vào clipboard!');"
                            class="text-[11px] text-emerald-400 hover:text-emerald-300 font-mono flex items-center gap-1 bg-emerald-950/50 px-3 py-1 rounded-lg border border-emerald-800 transition shadow">
                            <span>📋 Copy Nội Dung Bảng</span>
                        </button>
                    </div>
                    <textarea x-model="selectedChapter.content" rows="14"
                        class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-xs text-slate-200 leading-relaxed focus:outline-none focus:border-emerald-500 shadow-inner"></textarea>
                </div>

            </div>
        </template>
    </div>
</div>
