<!-- File path: templates/dashboard/partials/recompile_modal.html -->
<!-- Chú thích: Modal yêu cầu AI biên soạn, chuẩn hóa lại tri thức kèm Full Versioning -->

<div x-show="showRecompileModal" style="display: none;"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 space-y-6 shadow-2xl relative"
        @click.away="showRecompileModal = false">

        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h3 class="font-bold text-sm text-indigo-400 uppercase tracking-wide">🤖 Yêu cầu AI Biên Soạn Lại Tri Thức
            </h3>
            <button @click="showRecompileModal = false"
                class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
        </div>

        <div class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-400 font-mono mb-1">Hướng dẫn chỉnh sửa / Yêu cầu biên soạn (Prompt
                    Instruction)</label>
                <textarea x-model="recompileInstruction" rows="4"
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 font-mono focus:outline-none focus:border-indigo-500 leading-relaxed"
                    placeholder="VD: Hãy chuẩn hóa lại thành bảng Markdown rõ ràng, thêm điều kiện áp dụng và kiểm tra tính chính xác số học..."></textarea>
            </div>
            <p class="text-[11px] text-slate-500 font-mono italic">
                ℹ️ Hệ thống sẽ tự động lưu lại lịch sử phiên bản cũ (Full Versioning) vào bảng Audit Trail và thực hiện
                Auto Re-Index Vector ngay sau khi AI hoàn tất biên soạn.
            </p>
        </div>

        <div class="flex justify-end gap-3 pt-2 border-t border-slate-800">
            <button @click="showRecompileModal = false"
                class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-semibold text-xs transition">
                Hủy bỏ
            </button>
            <button @click="recompileWithAI()" :disabled="recompiling"
                class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 text-white rounded-xl font-bold text-xs shadow transition flex items-center gap-2">
                <span x-show="recompiling">⏳ AI đang biên soạn & cập nhật...</span>
                <span x-show="!recompiling">✨ Thực thi Biên Soạn Lại</span>
            </button>
        </div>
    </div>
</div>
