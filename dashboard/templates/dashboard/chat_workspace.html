<!-- File path: templates/dashboard/chat_workspace.html -->
<!-- Chú thích: Giao diện Cổng Chat Thông Minh & Tra Cứu Hybrid Search. -->

<div class="flex-1 flex flex-col bg-slate-900 overflow-hidden h-full w-full">

    <!-- Khung chứa tin nhắn có cuộn dọc độc lập -->
    <div x-ref="chatContainer" class="flex-1 overflow-y-auto p-6 space-y-6 min-h-0 relative">

        <!-- Vòng lặp tin nhắn -->
        <template x-for="msg in messages" :key="msg.id || Math.random()">
            <div :class="msg.sender === 'user' ? 'flex justify-end' : 'flex items-start gap-3'">
                <template x-if="msg.sender === 'ai'">
                    <div
                        class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-white text-xs font-bold shadow-lg shrink-0">
                        AI</div>
                </template>

                <div
                    :class="msg.sender === 'user' ? 'bg-emerald-600 text-white rounded-2xl rounded-tr-sm px-5 py-3 max-w-xl text-sm shadow' : 'bg-slate-950 border border-slate-800 text-slate-200 rounded-2xl rounded-tl-sm px-5 py-4 max-w-3xl text-sm shadow-md space-y-3'">
                    <div class="whitespace-pre-wrap leading-relaxed font-mono text-xs" x-text="msg.text"></div>

                    <!-- Trích dẫn tài liệu (Citations) -->
                    <template x-if="msg.citations && msg.citations.length > 0">
                        <div class="mt-3 pt-3 border-t border-slate-800/80 space-y-1.5">
                            <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">📚 Nguồn trích
                                dẫn nội bộ:</div>
                            <div class="flex flex-wrap gap-1.5">
                                <template x-for="cite in msg.citations">
                                    <div @click="jumpToEdit(cite.chapter_id)"
                                        class="bg-slate-900 hover:bg-slate-800 px-2.5 py-1 rounded border border-slate-700 text-[11px] text-slate-300 flex items-center gap-1.5 transition cursor-pointer">
                                        <span class="text-emerald-400 font-bold" x-text="cite.domain_name"></span>
                                        <span class="text-slate-400" x-text="'> ' + cite.title"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- HIỆU ỨNG ĐỘNG ĐANG XỬ LÝ -->
        <template x-if="isThinking">
            <div class="flex items-start gap-3 my-3">
                <div
                    class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-white text-xs font-bold shadow-lg shrink-0">
                    AI</div>
                <div
                    class="bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 max-w-xl shadow-md text-xs space-y-3">
                    <div class="flex items-center gap-2">
                        <span class="flex h-2 w-2 relative">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        <span class="text-emerald-400 font-semibold uppercase tracking-wider">Hệ thống đang xử lý thông
                            tin</span>
                    </div>
                    <div class="text-slate-300 font-mono flex items-center gap-2">
                        <span class="text-teal-400">▶</span>
                        <span x-text="thinkingSteps[currentStepIndex]"></span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-1 overflow-hidden">
                        <div class="bg-emerald-500 h-full transition-all duration-500 rounded-full"
                            :style="`width: ${((currentStepIndex + 1) / thinkingSteps.length) * 100}%`"></div>
                    </div>
                </div>
            </div>
        </template>

        <div x-ref="bottomAnchor"></div>
    </div>

    <!-- Ô nhập câu hỏi Chat -->
    <div class="p-4 bg-slate-950 border-t border-slate-800 shrink-0">
        <form @submit.prevent="sendMessage()" class="max-w-4xl mx-auto flex gap-3">
            <input type="text" x-model="question" placeholder="Nhập câu hỏi quy định, tính toán tài chính, đổi vàng..."
                class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 font-mono">
            <button type="submit" :disabled="isThinking"
                class="px-5 py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 text-white font-bold text-xs rounded-xl shadow transition flex items-center gap-2">
                <span>Gửi yêu cầu</span>
            </button>
        </form>
    </div>
</div>
