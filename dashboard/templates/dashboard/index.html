{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vnxBox - Universal B2B Local AI Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="{% static 'dashboard/js/alpine.min.js' %}"></script>
</head>

<body class="bg-slate-900 text-slate-100 font-sans antialiased" x-data="knowledgeApp()">

    <!-- CSRF Token ngầm để Django bảo mật request PATCH/POST từ JS -->
    {% csrf_token %}

    <div class="flex h-screen overflow-hidden">
        <!-- 1. Nhúng Sidebar bên trái -->
        {% include 'dashboard/partials/sidebar.html' %}

        <!-- 2. Nhúng Detail View bên phải -->
        {% include 'dashboard/partials/detail.html' %}
    </div>

    <!-- 3. Nhúng Widget Chat AI nổi -->
    {% include 'dashboard/partials/chat_widget.html' %}

    <!-- 4. Nhúng Modal Thêm mới tri thức -->
    {% include 'dashboard/partials/upload_modal.html' %}

    <!-- File JavaScript riêng biệt -->
    <script src="{% static 'dashboard/js/dashboard.js' %}"></script>
</body>

</html>
