<!-- SIDEBAR TREE (Bên trái) -->
<div class="w-1/3 border-r border-slate-800 flex flex-col bg-slate-950">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <h2 class="font-bold text-sm text-emerald-400">Kho Tri Thức & Tài Liệu</h2>
            <span
                class="text-[11px] px-2 py-0.5 bg-slate-900 border border-slate-800 rounded-full text-slate-400 font-mono"
                x-text="chapters.length + ' mục'"></span>
        </div>
        <button @click="showUploadModal = true"
            class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl shadow transition flex items-center gap-1">
            <span>+ Nạp file mới</span>
        </button>
    </div>

    <!-- Bộ lọc -->
    <div class="p-3 border-b border-slate-800 bg-slate-900/50 flex flex-col gap-2 text-xs">
        <div class="flex gap-1.5">
            <button @click="filterStatus = ''"
                :class="filterStatus === '' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'"
                class="px-2.5 py-1 rounded-lg transition">Tất cả</button>
            <button @click="filterStatus = 'AUTO_APPROVED'"
                :class="filterStatus === 'AUTO_APPROVED' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'"
                class="px-2.5 py-1 rounded-lg transition">Tự động duyệt</button>
            <button @click="filterStatus = 'NEEDS_REVIEW'"
                :class="filterStatus === 'NEEDS_REVIEW' ? 'bg-amber-600 text-white' : 'bg-slate-900 text-slate-400 border border-slate-800'"
                class="px-2.5 py-1 rounded-lg transition">Cần kiểm tra</button>
        </div>
        <select x-model="filterDomain"
            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-300">
            <option value="">📂 Tất cả Lĩnh vực (Domains)</option>
            <template x-for="d in availableDomains">
                <option :value="d.domain_name" x-text="d.domain_name"></option>
            </template>
        </select>
    </div>

    <!-- Danh sách items -->
    <div class="flex-1 overflow-y-auto divide-y divide-slate-800/40">
        <template x-for="item in filteredChapters" :key="item.id">
            <div @click="selectedChapter = item"
                :class="selectedChapter && selectedChapter.id === item.id ? 'bg-slate-900 border-l-4 border-emerald-500' : 'hover:bg-slate-900/40'"
                class="p-4 cursor-pointer transition">
                <div class="flex justify-between items-start mb-1">
                    <span
                        class="text-[10px] font-semibold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800"
                        x-text="item.domain_name"></span>
                    <span class="text-[10px] px-2 py-0.5 rounded-full font-bold uppercase"
                        :class="item.status === 'AUTO_APPROVED' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'"
                        x-text="item.status"></span>
                </div>
                <h3 class="font-semibold text-xs text-slate-100 line-clamp-1 mb-1" x-text="item.title"></h3>
                <p class="text-[11px] text-emerald-400 font-mono"
                    x-text="item.sub_domain ? 'Nghiệp vụ: ' + item.sub_domain : ''"></p>
            </div>
        </template>
    </div>
</div>

<!-- DETAIL CONFIG VIEW (Bên phải - Hiển thị nguồn gốc file, phạm vi, câu hỏi FAQ) -->
<div class="flex-1 flex flex-col bg-slate-900 overflow-y-auto p-6">
    <template x-if="selectedChapter">
        <div class="max-w-4xl mx-auto w-full space-y-6">

            <!-- Header tiêu đề và nút duyệt -->
            <div class="flex justify-between items-start border-b border-slate-800 pb-4">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs text-emerald-400 font-semibold uppercase"
                            x-text="selectedChapter.domain_name"></span>
                        <span class="text-xs text-slate-400"
                            x-text="selectedChapter.sub_domain ? ' > ' + selectedChapter.sub_domain : ''"></span>
                    </div>
                    <h2 class="text-2xl font-bold text-white" x-text="selectedChapter.title"></h2>
                </div>
                <div class="flex gap-2">
                    <button @click="showRecompileModal = true"
                        class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded shadow">🤖
                        AI Biên soạn lại</button>
                    <button @click="updateStatus('APPROVED')"
                        class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded shadow">Duyệt</button>
                </div>
            </div>

            <!-- THÔNG TIN NGUỒN GỐC FILE & PHẠM VI ÁP DỤNG -->
            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-2 text-xs">
                <h4 class="font-bold text-emerald-400 uppercase tracking-wider">📁 Nguồn gốc tài liệu & Phạm vi áp dụng
                </h4>
                <div class="grid grid-cols-2 gap-4 text-slate-300 font-mono">
                    <div>Nguồn File: <span class="text-white font-bold"
                            x-text="selectedChapter.source_file || 'Nhập văn bản thô'"></span></div>
                    <div>Phạm vi: <span class="text-white font-bold"
                            x-text="selectedChapter.metadata?.scope || 'Toàn hệ thống'"></span></div>
                </div>
            </div>

            <!-- CÂU HỎI MẪU (FAQ VARIATIONS) DO AI TỰ SINH THUỘC LĨNH VỰC -->
            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-2 text-xs">
                <h4 class="font-bold text-teal-400 uppercase tracking-wider">❓ Câu hỏi mẫu định tuyến ý định (Intent
                    Routing FAQs)</h4>
                <div class="space-y-1">
                    <template x-for="faq in selectedChapter.faq_variations || []">
                        <div class="p-2 bg-slate-900 rounded border border-slate-800 text-slate-200"
                            x-text="'- ' + faq.question_variation"></div>
                    </template>
                    <template x-if="!selectedChapter.faq_variations || selectedChapter.faq_variations.length === 0">
                        <p class="text-slate-500 italic">Hệ thống đang tự động sinh câu hỏi mẫu từ nội dung này.</p>
                    </template>
                </div>
            </div>

            <!-- Nội dung chi tiết -->
            <div class="space-y-2">
                <h4 class="text-xs font-bold text-slate-400 uppercase">Nội dung chi tiết (Chunk chuẩn hóa)</h4>
                <div class="bg-slate-950 border border-slate-800 p-5 rounded-xl text-sm text-slate-200 whitespace-pre-wrap font-mono leading-relaxed"
                    x-text="selectedChapter.content"></div>
            </div>
        </div>
    </template>
</div>
